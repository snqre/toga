package.name = "toga"
package.version = "1.0.5"
package.edition = "2021"
package.description = "Toga is a proc macro crate for cleaner and more ergonomic rust."
package.license = "Apache-2.0"
lib.proc-macro = true
dev-dependencies.trybuild.version = ">=1.0.0,<2.0.0"
dependencies.syn.version = ">=2.0.0,<3.0.0"
dependencies.syn.features = [
    "full"
]
dependencies.quote.version = ">=1.0.0,<2.0.0"
dependencies.proc-macro2.version = ">=1.0.0,<2.0.0"
profile.release.opt-level = 3

[[test]]
name = "test"
path = "test/main.rs"